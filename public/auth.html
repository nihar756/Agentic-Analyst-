<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroAnalyst AI - Authentication</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #f8fafc;
            --bg-card: #ffffff;
            --border-color: rgba(0, 0, 0, 0.08);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent: #107c41;
            --accent-gradient: linear-gradient(135deg, #107c41 0%, #217346 100%);
            --accent-glow: rgba(16, 124, 65, 0.1);
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
            --shadow-premium: 0 15px 35px rgba(0, 0, 0, 0.05), 0 3px 10px rgba(0, 0, 0, 0.02);
            --shadow-button: 0 4px 14px rgba(16, 124, 65, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: var(--shadow-premium);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .auth-header {
            text-align: center;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            text-decoration: none;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .logo i {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Tabs for toggle */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 8px 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .auth-tab.active {
            color: var(--accent);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Form styling */
        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px 14px 12px 38px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background-color: white;
        }

        .submit-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 8px;
            background: var(--accent-gradient);
            color: white;
            border: none;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow-button);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            box-shadow: 0 6px 18px rgba(16, 124, 65, 0.35);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Error/Success Alert Box */
        .alert-box {
            padding: 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            display: none;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }

        .alert-box.error {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #ef4444;
            display: flex;
        }

        .alert-box.success {
            background-color: #ecfdf5;
            border: 1px solid #d1fae5;
            color: #10b981;
            display: flex;
        }

        .back-home {
            text-align: center;
            font-size: 0.8rem;
        }

        .back-home a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home a:hover {
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-header">
                <a href="/" class="logo">
                    <i class="fa-solid fa-chart-line-up"></i>
                    <span>AeroAnalyst AI</span>
                </a>
                <div class="auth-subtitle" id="auth-subtitle">Welcome back! Please sign in.</div>
            </div>

            <!-- Login / Signup tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
                <div class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Register</div>
            </div>

            <!-- Alert box -->
            <div class="alert-box" id="alert-box"></div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="you@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="••••••••">
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="login-submit">
                    <span>Sign In</span>
                    <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>

            <!-- Signup Form (Hidden initially) -->
            <form id="signup-form" onsubmit="handleSignup(event)" style="display: none;">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="signup-name" required placeholder="John Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="signup-email" required placeholder="you@example.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="signup-password" required placeholder="Choose a secure password">
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="signup-submit">
                    <span>Create Account</span>
                    <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="back-home">
                <a href="/"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>

        </div>
    </div>

    <script>
        let currentMode = 'login';

        function switchTab(mode) {
            currentMode = mode;
            
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const subtitle = document.getElementById('auth-subtitle');
            const alertBox = document.getElementById('alert-box');
            
            // Clear alert
            alertBox.className = 'alert-box';
            alertBox.style.display = 'none';

            if (mode === 'login') {
                loginForm.style.display = 'flex';
                signupForm.style.display = 'none';
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                subtitle.innerText = 'Welcome back! Please sign in.';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'flex';
                tabLogin.classList.remove('active');
                tabSignup.classList.add('active');
                subtitle.innerText = 'Create your secure analyst account.';
            }
        }

        function showAlert(type, message) {
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'flex';
            alertBox.className = `alert-box ${type}`;
            
            const icon = type === 'error' 
                ? '<i class="fa-solid fa-circle-exclamation"></i>' 
                : '<i class="fa-solid fa-circle-check"></i>';
                
            alertBox.innerHTML = `${icon} <span>${message}</span>`;
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('login-submit');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Signing In...</span> <i class="fa-solid fa-circle-notch fa-spin"></i>';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Login failed');
                }

                showAlert('success', 'Authenticated successfully! Redirecting...');
                setTimeout(() => {
                    window.location.href = '/workspace';
                }, 1000);
            } catch (err) {
                showAlert('error', err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-right-to-bracket"></i>';
            }
        }

        async function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const submitBtn = document.getElementById('signup-submit');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Registering...</span> <i class="fa-solid fa-circle-notch fa-spin"></i>';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Registration failed');
                }

                showAlert('success', 'Account created! Please sign in.');
                setTimeout(() => {
                    switchTab('login');
                    document.getElementById('login-email').value = email;
                }, 1500);
            } catch (err) {
                showAlert('error', err.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Create Account</span> <i class="fa-solid fa-user-plus"></i>';
            }
        }
    </script>
</body>
</html>
